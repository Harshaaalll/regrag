name: Feature request
description: Suggest an idea, a pipeline, a metric or a document to add
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why does it help?
      description: A link to the paper or RBI document behind the idea is welcome.

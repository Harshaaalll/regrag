name: Bug report
description: Something is broken or gives a wrong result
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The exact command and the question you asked.
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      description: OS, Python version, Ollama model (for example qwen3:1.7b), free RAM.
  - type: textarea
    id: logs
    attributes:
      label: Output or error text
      render: shell
